name: Build Horizon iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    name: Build for iOS (aarch64)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          echo "Active Developer Directory: $DEVELOPER_DIR"

      - name: Build Horizon for iOS
        run: |
          cargo build --release --target aarch64-apple-ios

      - name: Upload Built Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-binary
          path: target/aarch64-apple-ios/release/
