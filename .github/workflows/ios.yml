name: Build Horizon iOS IPA

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab
  push:
    branches: [ "main", "ios-build" ]

env:
  CARGO_TERM_COLOR: always
  IOS_TARGET: aarch64-apple-ios

jobs:
  build-ipa:
    name: Compile & Package Unsigned IPA
    runs-on: macos-latest # Required for Xcode & iOS SDK

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust & iOS Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Set Up Java 25 (for horizon-prepare)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Fetch Private Game Jars
        env:
          CLIENT_JAR_URL: ${{ secrets.CLIENT_JAR_URL }}
          SERVER_JAR_URL: ${{ secrets.SERVER_JAR_URL }}
          ASSETS_ZIP_URL: ${{ secrets.ASSETS_ZIP_URL }}
        run: |
          mkdir -p game_files
          curl -L "$CLIENT_JAR_URL" -o game_files/26.3.jar
          curl -L "$SERVER_JAR_URL" -o game_files/server.jar
          if [ -n "$ASSETS_ZIP_URL" ]; then
            curl -L "$ASSETS_ZIP_URL" -o game_files/assets.zip
            unzip -q game_files/assets.zip -d game_files/assets
          fi

      - name: Generate Horizon Game Data
    run: |
      cargo run --release -p horizon-prepare -- \
        --client game_files/26.3.jar \
        --server game_files/server.jar \
        --out ios_bundle/resources

      - name: Build Rust Engine for iOS
        run: |
          cargo build --release --target $IOS_TARGET

      - name: Build & Package Unsigned IPA
        run: |
          # Build the Xcode wrapper project without code signing
          xcodebuild -project ios/Horizon.xcodeproj \
            -scheme Horizon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Bundle compiled binary + prepared resources into Payload/Horizon.app
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Horizon.app Payload/
          cp -r ios_bundle/resources Payload/Horizon.app/resources
          
          # Zip into an unsigned .ipa for SideStore/AltStore
          zip -qry Horizon-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS-IPA
          path: Horizon-iOS.ipa
