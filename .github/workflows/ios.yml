name: Build Horizon iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ios-build" ]

env:
  CARGO_TERM_COLOR: always
  IOS_TARGET: aarch64-apple-ios

jobs:
  build-ipa:
    name: Compile & Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust & iOS Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Set Up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Fetch Private Game Jars
        env:
          CLIENT_JAR_URL: ${{ secrets.CLIENT_JAR_URL }}
          SERVER_JAR_URL: ${{ secrets.SERVER_JAR_URL }}
        run: |
          mkdir -p game_files/.minecraft/versions/26.3
          curl -fL "$CLIENT_JAR_URL" -o game_files/.minecraft/versions/26.3/26.3.jar
          curl -fL "$SERVER_JAR_URL" -o game_files/server.jar

      - name: Generate Horizon Game Data
        run: |
          cargo run --release -p horizon-prepare -- \
            --prepare \
            --server-jar game_files/server.jar \
            --minecraft-dir game_files/.minecraft \
            --root ios_bundle
            
      - name: Build Rust Engine for iOS
        run: |
          cargo build --release --target $IOS_TARGET

      - name: Build & Package Unsigned IPA
        run: |
          xcodebuild -project apple/Horizon.xcodeproj \
            -scheme Horizon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Horizon.app Payload/
          cp -r ios_bundle/resources Payload/Horizon.app/resources
          
          zip -qry Horizon-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS-IPA
          path: Horizon-iOS.ipa
